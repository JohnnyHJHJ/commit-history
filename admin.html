<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commit History — Admin</title><style>:root{--bg:#121016;--card:#1b1820;--line:#302b36;--ink:#eeeaf2;--muted:#aaa2b3;--purple:#9b6bd3;--danger:#e87583}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}header,main{max-width:1050px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}a{color:var(--ink)}h1{font-size:24px}input,textarea,button{font:inherit;border-radius:9px;padding:10px;border:1px solid var(--line)}input{background:#211e27;color:var(--ink);min-width:270px}button{background:var(--card);color:var(--ink);cursor:pointer}.primary{background:var(--purple);border-color:var(--purple)}.danger{color:var(--danger)}.login{max-width:480px;margin:60px auto;display:grid;gap:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab.active{background:var(--purple)}.item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;margin:10px 0}.meta{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;margin-top:14px}.item img{max-width:100%;max-height:300px;border-radius:8px;margin-top:10px}@media(max-width:600px){header,main{padding:14px}.item{padding:13px}input{min-width:0;width:100%}.actions button{flex:1}}</style></head><body><header><h1>commit <span style="color:#9b6bd3">history</span> / admin</h1><a href="/">Public site</a></header><main id="app"></main><script>
let key=sessionStorage.getItem('commit-history-admin-key')||'', data={confessions:[],memories:[],feedback:[]},tab='confessions';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,opts={}){let r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+key,...(opts.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function render(){if(!key){app.innerHTML=`<section class="login"><h2>Admin access</h2><p class="meta">Enter the ADMIN_KEY configured in Vercel.</p><input id="key" type="password" placeholder="Admin key"><button class="primary" onclick="signIn()">Sign in</button><p id="error" class="danger"></p></section>`;return}let rows=data[tab]||[];app.innerHTML=`<div class="tabs">${['confessions','memories','feedback'].map(t=>`<button class="tab ${tab===t?'active':''}" onclick="tab='${t}';render()">${t[0].toUpperCase()+t.slice(1)} (${data[t]?.length||0})</button>`).join('')}<button onclick="load()">Refresh</button><button onclick="signOut()">Sign out</button></div><h2>${tab[0].toUpperCase()+tab.slice(1)}</h2>${rows.length?rows.map(item).join(''):'<p class="meta">Nothing here right now.</p>'}`}
function item(x){if(tab==='feedback')return `<article class="item"><div class="meta">${x.concern?'SERIOUS CONCERN · ':''}${esc(x.name)} · ${new Date(x.created_at).toLocaleString()}</div><p>${esc(x.message)}</p></article>`;return `<article class="item"><div class="meta">${esc(x.kind)} · ${esc(x.tag)} · ${esc(x.name)} · ${new Date(x.created_at).toLocaleString()}</div>${x.image_url?`<img src="${esc(x.image_url)}" alt="Submitted memory">`:''}<p>${esc(x.message)}</p><div class="actions"><button class="primary" onclick="act('approve','${x.kind}',${x.id})">Allow post</button><button class="danger" onclick="act('delete','${x.kind}',${x.id})">Delete</button></div></article>`}
async function signIn(){key=document.querySelector('#key').value.trim();try{await load();sessionStorage.setItem('commit-history-admin-key',key)}catch(e){key='';document.querySelector('#error').textContent='That admin key is not authorized.'}}
async function load(){data=await request('/admin');render()}
async function act(action,kind,id){if(action==='delete'&&!confirm('Permanently delete this submission?'))return;try{await request('/admin',{method:'POST',body:JSON.stringify({action,kind,id})});await load()}catch(e){alert(e.message)}}
function signOut(){key='';sessionStorage.removeItem('commit-history-admin-key');render()}render();if(key)load().catch(signOut)
</script></main></body></html>
