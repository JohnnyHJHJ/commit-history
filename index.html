<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commit History</title>
<meta name="description" content="A shared archive of memories, stories, and little moments.">
<style>
:root{--ink:#eeeaf2;--muted:#aaa2b3;--paper:#121016;--card:#1b1820;--line:#302b36;--purple:#9b6bd3;--purple-dark:#7f51b8;--lav:#292031;--danger:#e87583}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1080px)/2));position:sticky;top:0;background:#121016e8;backdrop-filter:blur(12px);z-index:10}
.brand{border:0;background:none;font-weight:750;letter-spacing:-.04em;color:var(--ink)}.brand span,.eyebrow,.tag{color:var(--purple)}.admin{border:0;background:none;color:var(--muted);font-size:13px}.wrap{max-width:1080px;margin:auto;padding:40px 22px 70px}
.hero{text-align:center;padding:70px 0 82px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800}.hero h1,.page h2,.modal h3{font-family:Georgia,"Times New Roman",serif}.hero h1{font-size:clamp(54px,9vw,92px);line-height:.92;letter-spacing:-.06em;margin:17px 0}.hero p{max-width:590px;margin:22px auto 34px;color:var(--muted);line-height:1.75;font-size:16px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 17px;border-radius:11px;font-weight:650;transition:.16s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px #3f274c12}.btn.primary{background:var(--purple);border-color:var(--purple);color:white}.btn.primary:hover{background:var(--purple-dark)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}.feature b{display:block;margin-bottom:7px}.feature p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
.page{max-width:900px;margin:auto;padding:30px 22px 70px}.back{border:0;background:none;color:var(--muted);padding:4px 0 18px}.pagehead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.page h2{font-size:43px;letter-spacing:-.04em;margin:5px 0}.pagehead p{margin:0;color:var(--muted)}.feed{display:grid;gap:13px}.feed.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.feed.grid .post p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.feed.grid .posttop{margin-bottom:4px}.feed.grid .memory img{aspect-ratio:1/1}.viewtoggle{margin-left:auto}.leader{align-items:stretch}.rank{min-width:170px;overflow:hidden;padding:0}.rank img{width:100%;height:105px;object-fit:cover;display:block;background:var(--lav)}.rank .rankbody{padding:10px}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input,.toolbar select,.modal input,.modal textarea{border:1px solid var(--line);background:#211e27;color:var(--ink);border-radius:10px;padding:10px 12px;outline:none}.toolbar input{flex:1}.post{border:1px solid var(--line);background:var(--card);border-radius:15px;overflow:hidden}.postbody{padding:18px}.posttop{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}.tag{font-weight:750}.post p{line-height:1.72;margin:13px 0 16px}.reacts{display:flex;gap:5px;flex-wrap:wrap}.react{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 9px;font-size:12px}.react.active{background:var(--lav);border-color:#d5c1e8}.reacts{position:relative}.reaction-menu{display:none;position:absolute;left:0;bottom:calc(100% + 7px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 30px #0008;grid-template-columns:repeat(5,1fr);gap:4px}.reaction-menu.open{display:grid}.react-choice{border:0;background:transparent;color:var(--ink);border-radius:8px;padding:7px 8px;font-size:14px;cursor:pointer}.react-choice:hover{background:var(--lav)}.memory img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#211e27}.leader{display:flex;gap:9px;overflow:auto;margin-bottom:17px}.rank{min-width:145px;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:13px}.rank small{display:block;color:var(--muted);font-size:11px}.rank strong{display:block;margin:4px 0}.modalback{position:fixed;inset:0;background:#21182788;display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.modal{width:min(650px,100%);max-height:91vh;overflow:auto;background:var(--card);border-radius:19px;padding:26px;box-shadow:0 25px 80px #21182733}.modal h3{font-size:28px;margin:0 0 15px}.modal p,.modal li{color:#635a69;line-height:1.65}.modal label{display:block;font-size:13px;font-weight:700;margin-top:12px}.remember{display:flex!important;align-items:center;gap:7px;font-weight:500!important}.remember input{width:auto!important;margin:0!important}.modal input,.modal textarea{width:100%;margin-top:6px}.modal textarea{min-height:145px;resize:vertical}.uploadbox{border:1px dashed #5a466e;background:#211c27;border-radius:12px;padding:18px;text-align:center;margin-top:7px}.uploadbox input{display:none}.uploadbox label{display:inline-block!important;margin:0!important}.uploadhint{font-size:12px;color:var(--muted);margin-top:7px}.preview{max-width:100%;max-height:260px;border-radius:12px;margin-top:12px;display:none}.adminstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#211e27}.stat b{font-size:20px;display:block}.queueitem{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--card);overflow:hidden}.queueitem .qbody{padding:15px}.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.qimg{width:100%;max-height:300px;object-fit:cover;display:block}.statuspill{font-size:11px;border-radius:999px;padding:4px 8px;background:var(--lav);color:var(--purple)}.notice{background:var(--lav);color:#c9b9d8;border-radius:12px;padding:14px;margin:15px 0;font-size:13px;line-height:1.55}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.error{color:var(--danger);font-size:13px;margin-top:7px}.empty{text-align:center;padding:45px;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}footer{text-align:center;color:#a09aa5;font-size:11px;padding:35px 20px 45px}
@media(max-width:650px){.features{grid-template-columns:1fr}.pagehead{align-items:flex-start;flex-direction:column}.hero{padding:40px 0 55px}.wrap{padding-top:25px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const REACTIONS=["❤️","😂","😭","🥹","👏","🫶","💀","✨","😮","🤍"];
const API_BASE="/api";
let state={confessions:[],memories:[],queue:[]};
let view="home",admin=false,loading=false;

async function api(path,options={}){
  const res=await fetch(API_BASE+path,{
    ...options,
    headers:{"Content-Type":"application/json",...(options.headers||{})}
  });
  const text=await res.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch{data={raw:text}}
  if(!res.ok)throw new Error(data.error||`API error ${res.status}`);
  return data;
}

function total(x){return Object.values(x.reactions||{}).reduce((a,b)=>a+Number(b||0),0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function loadData(){
  loading=true;
  try{
    const [confessions,memories]=await Promise.all([
      api("/confessions"),
      api("/memories")
    ]);
    state.confessions=(Array.isArray(confessions)?confessions:confessions.data||[]).map(normalizePost);
    state.memories=(Array.isArray(memories)?memories:memories.data||[]).map(normalizePost);
  }catch(err){
    console.error(err);
    state.confessions=[];
    state.memories=[];
    alert("Could not connect to the backend. Check your Vercel API routes and Neon connection.");
  }finally{
    loading=false;
    render();
  }
}

function normalizePost(x){
  return {
    ...x,
    tag:x.tag||`#${x.id||""}`,
    alias:x.alias??x.name??"anonymous",
    text:x.text??x.message??x.caption??"",
    caption:x.caption??x.message??x.text??"",
    src:x.src??x.image_url??"",
    reactions:x.reactions||{},
    status:x.status||(x.approved===false?"pending":"approved")
  };
}

async function refreshCurrent(){
  await loadData();
}

function nav(){return `<nav class="nav"><button class="brand" onclick="go('home')">commit <span>history</span></button><button class="admin" onclick="openModal('admin')">Admin</button></nav>`}
function shell(c){document.querySelector("#app").innerHTML=nav()+c+`<footer>made for the moments worth keeping.</footer>`}
function go(v){view=v;render()}

function render(){
  if(loading)return shell(`<main class="wrap"><div class="empty">Loading from Neon…</div></main>`);
  if(view==="home")return shell(`<main class="wrap"><section class="hero"><div class="eyebrow">our shared archive</div><h1>commit<br>history</h1><div class="actions"><button class="btn primary" onclick="go('confessions')">View confessions</button><button class="btn" onclick="go('memories')">View memories</button><button class="btn" onclick="openModal('feedback')">Give feedback</button><button class="btn" onclick="openModal('about')">Community standards</button></div></section></main>`);
  renderFeed(view==="memories");
}

function renderFeed(mem){
  let items=state[mem?"memories":"confessions"].filter(x=>x.status==="approved");
  items.sort((a,b)=>total(b)-total(a));
  shell(`<main class="page"><button class="back" onclick="go('home')">← Back home</button><div class="pagehead"><div><div class="eyebrow">${mem?"shared memories":"anonymous-ish thoughts"}</div><h2>${mem?"Memories":"Confessions"}</h2><p></p></div><button class="btn primary" onclick="openModal('${mem?"memory":"confession"}')">${mem?"Add a memory":"Post a confession"}</button></div>${mem?leader(items):""}<div class="toolbar"><input id="search" placeholder="Search…" oninput="filterPosts(this.value)"><select onchange="sortPosts(this.value)"><option value="popular">Most reacted</option><option value="new">Newest</option></select><button class="btn viewtoggle" onclick="toggleGrid()" id="gridBtn">List view</button></div><div id="feed" class="feed grid">${items.length?items.map(x=>post(x,mem)).join(""):`<div class="empty">Nothing here yet. Be the first to leave something behind.</div>`}</div></main>`);
}

function leader(items){return `<div class="leader">${items.slice(0,3).map((x,i)=>`<div class="rank"><img src="${esc(x.src)}" alt="Top memory"><div class="rankbody"><small>#${i+1} most reacted</small><strong>${esc(x.alias)}</strong><small>${total(x)} reactions</small></div></div>`).join("")}</div>`}

function post(x,mem){
  return `<article class="post ${mem?"memory":""}" data-search="${esc((x.text||x.caption).toLowerCase())}">${mem?`<img src="${esc(x.src)}" alt="Shared memory">`:""}<div class="postbody"><div class="posttop"><span class="tag">${esc(x.tag)}</span><span>${esc(x.alias)}</span></div><p>${esc(x.text||x.caption)}</p><div class="reacts"><button class="react reaction-trigger" onclick="toggleReactionMenu(this)">React <span>${total(x)}</span></button><div class="reaction-menu">${REACTIONS.map(r=>`<button class="react-choice" onclick="react('${esc(x.tag)}',this,'${r}')">${r} <span>${x.reactions?.[r]||0}</span></button>`).join("")}</div></div></div></article>`
}

function toggleGrid(){const f=document.querySelector("#feed"),b=document.querySelector("#gridBtn");f.classList.toggle("grid");b.textContent=f.classList.contains("grid")?"List view":"Grid view"} 
function filterPosts(q){document.querySelectorAll(".post").forEach(p=>p.style.display=p.dataset.search.includes(q.toLowerCase())?"":"none")}
function sortPosts(v){let mem=view==="memories",items=state[mem?"memories":"confessions"].filter(x=>x.status==="approved");if(v==="popular")items.sort((a,b)=>total(b)-total(a));if(v==="new")items.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));document.querySelector("#feed").innerHTML=items.map(x=>post(x,mem)).join("")}

function toggleReactionMenu(btn){
  const menu=btn.parentElement.querySelector(".reaction-menu");
  document.querySelectorAll(".reaction-menu.open").forEach(m=>{if(m!==menu)m.classList.remove("open")});
  menu.classList.toggle("open");
}

async function react(tag,btn,r){
  let arr=state[view==="memories"?"memories":"confessions"],x=arr.find(y=>y.tag===tag);
  if(!x)return;
  try{
    const result=await api("/reactions",{
      method:"POST",
      body:JSON.stringify({
        post_type:view==="memories"?"memory":"confession",
        post_id:x.id,
        tag:x.tag,
        reaction:r
      })
    });
    x.reactions=x.reactions||{};
    if(result&&result.reactions)x.reactions=result.reactions;
    else x.reactions[r]=(x.reactions[r]||0)+1;
    btn.parentElement.parentElement.querySelector(".reaction-trigger span").textContent=total(x);
    btn.parentElement.classList.remove("open");
  }catch(err){
    console.error(err);
    alert("Reaction could not be saved.");
  }
}

document.addEventListener("click",e=>{
  if(!e.target.closest(".reacts"))document.querySelectorAll(".reaction-menu.open").forEach(m=>m.classList.remove("open"));
});

function openModal(type){
 let body="";
 if(type==="confession")body=`<h3>Post a confession</h3><div class="notice"><b>Commit History Community Standards</b><ol><li>Be kind and respectful. No discrimination, harassment, or hate speech.</li><li>Respect diverse opinions. Constructive criticism is welcome, but we do not tolerate attacks of any kind.</li><li>Keep discussions clean. No explicit, offensive, or NSFW content.</li><li>Don’t gossip. This is not a place to spread harmful rumors or baseless accusations.</li></ol>Before your confessions get posted, they will be screened by the batch representative and other relevant parties.</div><label>Alias / username</label><input id="alias" maxlength="40" placeholder="e.g. sleepdepriveddev"><label>Your confession</label><textarea id="text" maxlength="1200" placeholder="Say what you need to say…"></textarea><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitPost(false)">Submit for review</button></div>`;
 if(type==="memory")body=`<h3>Add a memory</h3><label>Alias</label><input id="alias" maxlength="40" placeholder="e.g. camera roll historian"><label>Image</label><div class="uploadbox"><input id="imageFile" type="file" accept="image/*" onchange="loadImageFile(event)"><label class="btn" for="imageFile">Choose an image</label><div class="uploadhint">Or copy an image and press Ctrl/Cmd + V here.</div><img id="imagePreview" class="preview" alt="Preview"></div><input id="src" type="hidden"><label>Caption</label><textarea id="text" maxlength="500" placeholder="What should we remember about this?"></textarea><div class="notice">Memories are reviewed before publication. Only upload images you have permission to share.</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitPost(true)">Submit memory</button></div>`;
 if(type==="feedback")body=`<h3>Give feedback</h3><p>Tell us what would make this better.</p><input id="alias" placeholder="Optional alias"><textarea id="text" maxlength="1000" placeholder="Your feedback…"></textarea><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="alert('Thanks! Your feedback was recorded.');closeModal()">Send feedback</button></div>`;
 if(type==="about")body=`<h3>Commit History Community Standards</h3><p>We trust that our members are mature enough to understand the spirit of our Community Standards. Please take a moment to familiarize yourself with these guidelines to ensure a respectful and inclusive environment for everyone:</p><ol><li><b>Be kind and respectful.</b> No discrimination, harassment, or hate speech.</li><li><b>Respect diverse opinions.</b> Constructive criticism is welcome, but we do not tolerate attacks of any kind.</li><li><b>Keep discussions clean.</b> No explicit, offensive, or NSFW content.</li><li><b>Don’t gossip.</b> This is not a place to spread harmful rumors or baseless accusations.</li></ol><p>Before your confessions get posted, they will be screened by the batch representative and other relevant parties.</p><div class="modalfoot"><button class="btn primary" onclick="closeModal()">Got it</button></div>`;
 if(type==="admin")body=admin?adminPanel():`<h3>Admin access</h3><p>For batch representatives and authorized moderators only.</p><input id="login" placeholder="Username"><input id="password" type="password" placeholder="Password"><label class="remember"><input id="rememberMe" type="checkbox"> Remember me</label><div id="err" class="error"></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="login()">Sign in</button></div>`;
 document.body.insertAdjacentHTML("beforeend",`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${body}</div></div>`);
}

function adminPanel(){
  let q=state.queue;
  return `<h3>Moderation queue</h3><p>${q.length?`There ${q.length===1?"is":"are"} ${q.length} submission${q.length===1?"":"s"} waiting for review.`:"The queue is clear."}</p>${q.map((x,i)=>`<div class="post" style="margin:12px 0"><div class="postbody"><div class="posttop"><span class="tag">${esc(x.tag)}</span><span>${esc(x.kind)} · ${esc(x.alias)}</span></div>${x.src?`<img src="${esc(x.src)}" style="width:100%;margin:12px 0;border-radius:10px">`:""}<p>${esc(x.text||x.caption)}</p><div class="modalfoot"><button class="btn" onclick="moderate(${i},false)">Reject</button><button class="btn primary" onclick="moderate(${i},true)">Approve</button></div></div></div>`).join("")}<div class="modalfoot"><button class="btn" onclick="admin=false;closeModal()">Sign out</button></div>`
}

function closeModal(){document.querySelector(".modalback")?.remove()}

function login(){
  if(document.querySelector("#login").value==="batch2026commithistory"&&document.querySelector("#password").value==="password1234567"){
    admin=true;
    if(document.querySelector("#rememberMe")?.checked)localStorage.setItem("commit-history-admin","1");
    else localStorage.removeItem("commit-history-admin");
    closeModal();setTimeout(()=>openModal("admin"),80)
  }else document.querySelector("#err").textContent="Those credentials do not have administrator access."
}

function moderate(i,approve){
  alert("Moderation is not connected to the API yet. The public posts and reactions are connected to Neon.");
}

function loadImageFile(e){const file=e.target.files?.[0];if(file)readImage(file)}
function readImage(file){if(!file.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>{document.querySelector("#src").value=r.result;const p=document.querySelector("#imagePreview");p.src=r.result;p.style.display="block"};r.readAsDataURL(file)}
document.addEventListener("paste",e=>{if(!document.querySelector(".modalback")||!document.querySelector("#imagePreview"))return;const item=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith("image/"));if(item){e.preventDefault();readImage(item.getAsFile())}})

async function submitPost(mem){
  let alias=(document.querySelector("#alias").value.trim()||"anonymous").slice(0,40);
  let text=document.querySelector("#text").value.trim();
  if(!text)return alert("Please add some text.");

  let payload={
    tag:(mem?"#M-":"#CH-")+Date.now(),
    name:alias,
    alias:alias,
    message:text,
    text:text,
    caption:mem?text:undefined,
    src:mem?document.querySelector("#src").value.trim():undefined,
    approved:true
  };

  if(mem&&!payload.src)return alert("Please choose or paste an image.");

  try{
    await api(mem?"/memories":"/confessions",{
      method:"POST",
      body:JSON.stringify(payload)
    });
    closeModal();
    alert(mem?"Memory submitted.":"Confession submitted.");
    await loadData();
  }catch(err){
    console.error(err);
    alert("Submission failed. Check your backend API.");
  }
}

if(localStorage.getItem("commit-history-admin")==="1")admin=true;
loadData();
</script>
</body>
</html>
