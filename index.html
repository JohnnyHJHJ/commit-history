<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Commit -m "History"</title>
    <meta name="description" content="A shared archive of memories, stories, and little moments." />
    <style>
        /* ── reset & variables ── */
        :root {
            --bg: #17121e;
            --surface: #221d2b;
            --surface-2: #2d2638;
            --ink: #f0ebf5;
            --muted: #b3aac2;
            --line: #3d344b;
            --purple: #b084e8;
            --purple-dark: #9369d4;
            --purple-glow: #7f51b855;
            --amber: #f5c87a;
            --amber-dim: #f5c87a22;
            --rose: #f09b9b;
            --card-radius: 18px;
            --shadow: 0 12px 40px #100A0F;
            --transition: 0.25s cubic-bezier(.22, .61, .36, 1);
            --cs10: #f97316;
            --cs11: #3b82f6;
            --cs30: #22c55e;
            --math21: #a855f7;
        }
        * { box-sizing: border-box; margin: 0; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            padding-bottom: 1px;
        }
        button, input, textarea, select { font: inherit; color: inherit; }
        button { cursor: pointer; background: none; border: none; padding: 0; }
        a { color: var(--purple); text-decoration: none; }
        img { display: block; max-width: 100%; }

        /* ── scrollbar ── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; }

        /* ── nav ── */
        .nav {
            height: 64px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 max(18px, calc((100vw - 1080px)/2));
            position: sticky;
            top: 0;
            background: #17121ee8;
            backdrop-filter: blur(14px);
            z-index: 20;
            gap: 10px;
        }
        .brand {
            font-weight: 750;
            letter-spacing: -.04em;
            font-size: 1.2rem;
            color: var(--ink);
            transition: color var(--transition);
        }
        .brand:hover { color: var(--purple); }
        .brand span { color: var(--purple); }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-actions .admin-link {
            color: var(--muted);
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background var(--transition), color var(--transition);
        }
        .nav-actions .admin-link:hover {
            background: var(--surface);
            color: var(--ink);
        }

        /* ── layout ── */
        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 18px 60px;
            position: relative;
            z-index: 1;
        }
        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 18px 60px;
            position: relative;
            z-index: 1;
        }

        /* ── hero ── */
        .hero {
            text-align: center;
            padding: 30px 0 40px;
            position: relative;
        }
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, var(--purple-glow), transparent 70%);
            opacity: .25;
            pointer-events: none;
        }
        .hero>* { position: relative; z-index: 1; }
        .eyebrow {
            text-transform: uppercase;
            letter-spacing: .16em;
            font-size: 11px;
            font-weight: 800;
            color: var(--purple);
        }
        .hero h1 {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: clamp(48px, 10vw, 88px);
            line-height: .92;
            letter-spacing: -.06em;
            margin: 14px 0 20px;
            background: linear-gradient(135deg, #f0ebf5 30%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .actions .btn { min-width: 130px; }

        /* ── home grid ── */
        .home-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-top: 20px;
            align-items: start;
        }
        .home-main { display: flex; flex-direction: column; gap: 20px; }
        .home-side { display: flex; flex-direction: column; gap: 20px; }

        /* ── buttons ── */
        .btn {
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: .9rem;
            transition: background var(--transition), transform var(--transition), box-shadow var(--transition), border-color var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 44px;
            user-select: none;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px #0c081244;
            border-color: var(--purple);
        }
        .btn:active { transform: scale(.97); }
        .btn.primary {
            background: var(--purple);
            border-color: var(--purple);
            color: #0c0812;
        }
        .btn.primary:hover {
            background: var(--purple-dark);
            border-color: var(--purple-dark);
            color: #0c0812;
        }
        .btn.ghost {
            background: transparent;
            border-color: transparent;
        }
        .btn.ghost:hover {
            background: var(--surface);
            border-color: var(--line);
        }
        .btn.small {
            padding: 6px 12px;
            font-size: .8rem;
            min-height: 32px;
            border-radius: 9px;
        }
        .btn.danger {
            border-color: var(--rose);
            color: var(--rose);
        }
        .btn.danger:hover {
            background: var(--rose);
            color: #0c0812;
            border-color: var(--rose);
        }

        /* ── cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--card-radius);
            padding: 20px 22px 22px;
            transition: border-color var(--transition), transform var(--transition);
        }
        .card:hover {
            border-color: #5a4a6e;
            transform: translateY(-2px);
        }
        .card .eyebrow { font-size: 9px; }
        .card h3 {
            font-size: 1.1rem;
            margin: 4px 0 14px;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-weight: 400;
        }
        .mini-item {
            border-top: 1px solid var(--line);
            padding: 8px 0;
            font-size: .85rem;
        }
        .mini-item:first-of-type { border-top: 0; }
        .mini-item b { display: block; font-weight: 600; }
        .mini-item small { color: var(--muted); font-size: .78rem; }

        /* announcements */
        .announcement-item {
            border-bottom: 1px solid var(--line);
            padding: 10px 0;
        }
        .announcement-item:last-child { border-bottom: 0; }
        .announcement-item .title { font-weight: 600; font-size: .95rem; }
        .announcement-item .meta {
            color: var(--muted);
            font-size: .75rem;
            display: flex;
            gap: 12px;
            margin-top: 2px;
        }
        .announcement-item .body {
            color: #ddd6e6;
            font-size: .88rem;
            margin-top: 4px;
        }
        .announcement-item .admin-actions {
            margin-top: 6px;
            display: flex;
            gap: 6px;
        }

        /* tests timeline */
        .test-item {
            display: flex;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--line);
            align-items: center;
        }
        .test-item:last-child { border-bottom: 0; }
        .test-item .subject-badge {
            font-weight: 700;
            font-size: .7rem;
            padding: 2px 10px;
            border-radius: 99px;
            background: var(--line);
            color: var(--ink);
            flex-shrink: 0;
        }
        .test-item .subject-badge.cs10 { background: var(--cs10); color: #0c0812; }
        .test-item .subject-badge.cs11 { background: var(--cs11); color: #fff; }
        .test-item .subject-badge.cs30 { background: var(--cs30); color: #0c0812; }
        .test-item .subject-badge.math21 { background: var(--math21); color: #fff; }
        .test-item .test-date {
            color: var(--muted);
            font-size: .75rem;
            white-space: nowrap;
        }
        .test-item .test-desc { font-size: .88rem; flex: 1; }
        .test-item .admin-actions { margin-left: auto; display: flex; gap: 4px; }

        /* ── page header ── */
        .pagehead {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .pagehead .left .eyebrow { font-size: 10px; }
        .pagehead h2 {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 2.2rem;
            letter-spacing: -.04em;
            margin: 2px 0 0;
        }
        .pagehead p { color: var(--muted); margin: 0; }

        /* ── toolbar ── */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .toolbar input,
        .toolbar select {
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            border-radius: 10px;
            padding: 8px 12px;
            outline: none;
            font-size: .9rem;
            min-height: 42px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .toolbar input:focus,
        .toolbar select:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px var(--purple-glow);
        }
        .toolbar input { flex: 1; min-width: 140px; }
        .toolbar select { min-width: 110px; }

        /* ── feed ── */
        .feed { display: grid; gap: 14px; }
        .feed.grid {
            grid-template-columns: 1fr;
            max-width: 620px;
            margin: 0 auto;
        }

        /* ── post card ── */
        .post {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: var(--card-radius);
            overflow: hidden;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .post:hover {
            border-color: #5a4a6e;
            box-shadow: 0 4px 24px #0c081244;
        }
        .post .media {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            background: #1a1523;
            display: block;
        }
        .postbody {
            padding: 18px 20px 16px;
        }
        .posttop {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .posttop .tag { font-weight: 700; color: var(--purple); }
        .posttop .alias {
            font-weight: 700;
            color: #e0d8ed;
            font-size: 1rem;
        }
        .post p {
            line-height: 1.72;
            margin: 8px 0 14px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            font-size: .95rem;
        }

        /* ── reactions ── */
        .reacts {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
            position: relative;
        }
        .react {
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--ink);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: .8rem;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: background var(--transition), border-color var(--transition), transform var(--transition);
            min-height: 32px;
        }
        .react:hover {
            background: var(--line);
            transform: translateY(-1px);
        }
        .react.active {
            background: #3d2b5a;
            border-color: var(--purple);
        }
        .react .count {
            color: var(--muted);
            font-size: .7rem;
            margin-left: 1px;
        }
        .reaction-menu {
            display: none;
            position: absolute;
            left: 0;
            bottom: calc(100% + 6px);
            z-index: 30;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 5px;
            box-shadow: 0 12px 36px #0c0812cc;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            width: 180px;
        }
        .reaction-menu.open { display: grid; }
        .react-choice {
            border: 0;
            background: transparent;
            color: var(--ink);
            border-radius: 7px;
            padding: 4px 2px;
            font-size: 1.1rem;
            transition: background var(--transition);
            min-height: 36px;
        }
        .react-choice:hover { background: var(--line); }

        /* ── replies ── */
        .replies-wrap {
            margin: 14px 0 10px;
            padding: 12px 14px 8px;
            background: var(--surface-2);
            border-radius: 12px;
            border-left: 3px solid var(--purple);
        }
        .replies-wrap.hidden { display: none !important; }
        .replies-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--purple);
            font-weight: 800;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .replies-title .count-badge {
            background: var(--line);
            color: var(--muted);
            font-size: 9px;
            padding: 0 8px;
            border-radius: 99px;
            font-weight: 600;
        }
        .reply-item {
            padding: 6px 0;
            border-top: 1px solid var(--line);
            font-size: .88rem;
        }
        .reply-item:first-of-type { border-top: 0; }
        .reply-item .rname {
            font-weight: 600;
            font-size: .78rem;
            color: var(--purple);
            display: inline-block;
            margin-right: 6px;
        }
        .reply-item .rmsg {
            display: block;
            color: #67636B;
            line-height: 1.5;
            margin-top: 1px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: .9rem;
        }
        .reply-empty {
            color: var(--muted);
            font-size: .85rem;
            padding: 4px 0;
        }
        .reply-loading {
            color: var(--muted);
            font-size: .8rem;
        }

        /* ── reply form ── */
        .inline-reply-form {
            display: none;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            flex-wrap: wrap;
            animation: slideDown .3s ease;
        }
        .inline-reply-form.open { display: flex; }
        .inline-reply-form input,
        .inline-reply-form textarea {
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--ink);
            border-radius: 9px;
            padding: 7px 10px;
            outline: none;
            font-size: .85rem;
            transition: border-color var(--transition), box-shadow var(--transition);
            min-height: 38px;
        }
        .inline-reply-form input:focus,
        .inline-reply-form textarea:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px var(--purple-glow);
        }
        .inline-reply-form input {
            width: 120px;
            flex-shrink: 0;
        }
        .inline-reply-form textarea {
            flex: 1;
            min-width: 140px;
            resize: vertical;
        }
        .inline-reply-form .btn {
            flex-shrink: 0;
            min-height: 38px;
            padding: 0 16px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── reply toggle ── */
        .reply-toggle {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
            border-radius: 999px;
            padding: 4px 12px;
            font-size: .78rem;
            transition: background var(--transition), color var(--transition), border-color var(--transition);
            min-height: 30px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .reply-toggle:hover {
            background: var(--surface-2);
            color: var(--ink);
            border-color: var(--purple);
        }
        .reply-toggle .icon { font-size: .9rem; }

        /* ── leaderboard ── */
        .leader {
            display: flex;
            gap: 10px;
            overflow: auto;
            margin-bottom: 18px;
            padding-bottom: 4px;
        }
        .rank {
            min-width: 140px;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 14px;
            padding: 12px 14px;
            flex-shrink: 0;
            transition: border-color var(--transition), transform var(--transition);
        }
        .rank:hover {
            border-color: var(--purple);
            transform: translateY(-2px);
        }
        .rank img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            background: var(--bg);
        }
        .rank small {
            display: block;
            color: var(--muted);
            font-size: 10px;
            margin-top: 4px;
        }
        .rank strong {
            display: block;
            font-size: .95rem;
            margin: 2px 0;
        }

        /* ── modal ── */
        .modalback {
            position: fixed;
            inset: 0;
            background: #0c0812cc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
            backdrop-filter: blur(4px);
            animation: fadeIn .2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal {
            width: min(620px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--card-radius);
            padding: 26px 28px 28px;
            box-shadow: 0 24px 72px #0c0812cc;
            animation: slideUp .25s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal h3 {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.6rem;
            margin: 0 0 6px;
            letter-spacing: -.03em;
        }
        .modal p, .modal li {
            color: var(--muted);
            line-height: 1.65;
            font-size: .95rem;
        }
        .modal label {
            display: block;
            font-size: .8rem;
            font-weight: 600;
            margin-top: 14px;
            color: var(--muted);
        }
        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            margin-top: 4px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--ink);
            border-radius: 10px;
            padding: 9px 12px;
            outline: none;
            font-size: .9rem;
            transition: border-color var(--transition), box-shadow var(--transition);
            min-height: 42px;
        }
        .modal input:focus,
        .modal textarea:focus,
        .modal select:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px var(--purple-glow);
        }
        .modal textarea {
            min-height: 100px;
            resize: vertical;
        }
        .modalfoot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .notice {
            background: #2d1f3a;
            color: #d4c4e6;
            border-radius: 10px;
            padding: 12px 16px;
            margin: 12px 0;
            font-size: .85rem;
            line-height: 1.55;
            border-left: 3px solid var(--purple);
        }
        .error { color: var(--rose); font-size: .85rem; margin-top: 6px; }

        /* ── upload box ── */
        .uploadbox {
            border: 1.5px dashed #5a466e;
            background: #1a1523;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-top: 4px;
            transition: border-color var(--transition), background var(--transition);
            cursor: pointer;
        }
        .uploadbox:hover {
            border-color: var(--purple);
            background: #221d2b;
        }
        .uploadbox input { display: none; }
        .uploadbox label {
            display: inline-block !important;
            margin: 0 !important;
            font-weight: 500 !important;
            color: var(--purple);
            cursor: pointer;
        }
        .preview {
            max-width: 100%;
            max-height: 240px;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
        }

        /* ── empty state ── */
        .empty {
            text-align: center;
            padding: 40px 20px;
            border: 1px dashed var(--line);
            border-radius: var(--card-radius);
            color: var(--muted);
            font-size: .95rem;
        }

        /* ── birthday grid ── */
        .bday-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin: 12px 0;
        }
        .bday-month {
            border: 1px solid var(--line);
            background: var(--bg);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .bday-month h4 {
            font-size: .85rem;
            color: var(--purple);
            margin: 0 0 8px;
            font-weight: 700;
        }
        .bday-entry {
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 6px;
            background: var(--surface-2);
            border-radius: 8px;
            padding: 6px 10px;
            margin: 4px 0;
            font-size: .85rem;
        }
        .bday-entry .day { font-weight: 700; color: var(--rose); }
        .bday-entry .name { font-weight: 500; }
        .bday-entry .small { color: var(--muted); font-size: .7rem; display: block; }

        /* ── footer ── */
        footer {
            text-align: center;
            color: #6a6078;
            font-size: 11px;
            padding: 30px 18px 40px;
            position: relative;
            z-index: 1;
            border-top: 1px solid var(--line);
            margin-top: 20px;
        }

        /* ── memory drift ── */
        .memory-drift {
            position: fixed;
            inset: 64px 0 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            opacity: .08;
        }
        .memory-drift img {
            position: absolute;
            width: 200px;
            height: 140px;
            object-fit: cover;
            border-radius: 16px;
            animation: drift 38s linear infinite;
            filter: saturate(.6);
        }
        .memory-drift img:nth-child(2) { top: 18%; animation-delay: -13s; }
        .memory-drift img:nth-child(3) { top: 62%; animation-delay: -25s; }
        @keyframes drift {
            from { transform: translateX(-280px) rotate(-3deg); }
            to { transform: translateX(calc(100vw + 280px)) rotate(3deg); }
        }

        /* ── mobile ── */
        @media (max-width: 900px) {
            .home-grid { grid-template-columns: 1fr; }
            .home-side { order: -1; }
        }
        @media (max-width: 700px) {
            .wrap { padding: 16px 14px 40px; }
            .page { padding: 10px 14px 40px; }
            .hero { padding: 20px 0 28px; }
            .hero h1 { font-size: clamp(36px, 12vw, 56px); }
            .pagehead { flex-direction: column; align-items: flex-start; }
            .pagehead h2 { font-size: 1.7rem; }
            .feed.grid { grid-template-columns: 1fr; }
            .postbody { padding: 14px 14px 12px; }
            .inline-reply-form input { width: 100%; }
            .inline-reply-form textarea { min-width: 0; width: 100%; }
            .inline-reply-form { flex-direction: column; }
            .inline-reply-form .btn { align-self: flex-end; }
            .toolbar { flex-wrap: wrap; }
            .toolbar input { min-width: 100px; flex: 1 1 140px; }
            .leader { gap: 8px; }
            .rank { min-width: 110px; padding: 10px 12px; }
            .rank img { height: 70px; }
            .modal { padding: 20px 16px; }
            .reaction-menu { width: 150px; left: 0; right: auto; }
            .reacts { gap: 3px; }
            .react { padding: 3px 8px; font-size: .75rem; min-height: 28px; }
            .nav { padding: 0 14px; height: 58px; }
            .brand { font-size: 1rem; }
            .memory-drift img { width: 120px; height: 90px; }
            .bday-grid { grid-template-columns: 1fr 1fr; }
            .home-grid { grid-template-columns: 1fr; }
            .home-side { order: -1; }
        }
        @media (max-width: 420px) {
            .actions .btn { min-width: 100%; justify-content: center; }
            .bday-grid { grid-template-columns: 1fr; }
            .pagehead .left .eyebrow { font-size: 9px; }
        }

        /* ── utilities ── */
        .mt-8 { margin-top: 8px; }
        .gap-6 { gap: 6px; }
        .flex-wrap { flex-wrap: wrap; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }
        .hidden { display: none !important; }
        .relative { position: relative; }
        /* bulletin-board redesign */
        body{background:#f8f1df;color:#111;font-family:Arial,Helvetica,sans-serif}.nav{height:72px;background:#a855f7;border-bottom:4px solid #111;backdrop-filter:none}.brand,.brand span{color:#111;font-family:Impact,"Arial Black",sans-serif;text-transform:uppercase;font-size:1.35rem}.nav-actions .admin-link{color:#111;border:3px solid #111;background:#f5ff81;border-radius:0;font-weight:900;text-transform:uppercase}.wrap{max-width:1220px}.btn,.card,.post,.toolbar input,.toolbar select{border:3px solid #111;border-radius:0;box-shadow:5px 5px 0 #111}.btn{background:#fff;color:#111;font-weight:900;text-transform:uppercase}.btn.primary{background:#a855f7;border-color:#111;color:#111}.btn:hover,.card:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 #111}.btn:active{transform:translate(5px,5px);box-shadow:none}.card{background:#fff7ca}.home-grid{grid-template-columns:minmax(0,1.25fr) minmax(310px,.8fr);gap:28px}.bulletin{display:grid;grid-template-columns:1.25fr .8fr;gap:28px;align-items:start}.bulletin-brand{min-height:360px;background:#a855f7;border:4px solid #111;box-shadow:9px 9px 0 #111;padding:32px;position:relative;overflow:hidden}.bulletin-brand:after{content:'✳';position:absolute;color:#f5ff81;font-size:130px;right:-20px;bottom:-48px}.bulletin-brand p{max-width:470px;font-weight:800;font-size:1.08rem}.bulletin-brand h1{font-family:Impact,"Arial Black",sans-serif;color:#111;background:none;-webkit-text-fill-color:#111;font-size:clamp(3.5rem,9vw,7.6rem);text-transform:uppercase;line-height:.78;margin:12px 0 20px}.bulletin-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:500px}.bulletin-actions .btn:last-child{grid-column:span 2;background:#f5ff81}.quick-card{background:#0e0b8c;color:#fff;border:4px solid #111;box-shadow:8px 8px 0 #111;padding:18px}.quick-card h2{font-family:Impact,"Arial Black",sans-serif;text-transform:uppercase;font-size:1.8rem;font-weight:400;margin-bottom:13px}.quick-card .mini-item{border-color:#817cf3}.quick-card .mini-item small{color:#e3e2ff}.quick-card .btn{margin-top:15px;background:#ffacd6}.section-label{display:inline-block;background:#f5ff81;border:3px solid #111;padding:3px 10px;font-family:Impact,"Arial Black",sans-serif;text-transform:uppercase;font-size:1.15rem;transform:rotate(-2deg);margin-bottom:12px}.archive-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.archive-grid .card:nth-child(1){background:#ffb2c5}.archive-grid .card:nth-child(2){background:#aef2cf}.archive-grid .card:nth-child(3){background:#b7d9ff}.archive-grid .card:nth-child(4){background:#ffc078}.card h3,.pagehead h2{font-family:Impact,"Arial Black",sans-serif;text-transform:uppercase;font-weight:400}.announcement-item{border-color:#111}.announcement-item .body{color:#111}.announcement-item .meta{color:#4b3d55}.empty{border:3px dashed #111;color:#111;background:#fff;padding:20px}.post{border:3px solid #111;background:#fff7ca;box-shadow:5px 5px 0 #111}.post:hover{box-shadow:2px 2px 0 #111}.react,.reply-toggle{border:2px solid #111;border-radius:0;background:#fff;color:#111}.replies-wrap{background:#f1d2ff;border-left:5px solid #111;border-radius:0}.modal{border:4px solid #111;border-radius:0;box-shadow:10px 10px 0 #111;background:#fff7ca}@media(max-width:760px){.bulletin,.home-grid{grid-template-columns:1fr}.bulletin-brand{min-height:300px;padding:24px}.archive-grid{grid-template-columns:1fr}.bulletin-actions{grid-template-columns:1fr}.bulletin-actions .btn:last-child{grid-column:auto}}

<body>

    <div id="app"></div>

    <script>
        // ─── constants ──────────────────────────────────────────────────────────
        const REACTIONS = ['❤️', '😂', '😭', '🥹', '👏', '🫶', '💀', '✨', '😮', '🤍'];
        const API_BASE = '/api';
        const SUBJECTS = ['CS 10', 'CS 11', 'CS 30', 'Math 21'];
        const SUBJECT_COLORS = { 'CS 10': 'cs10', 'CS 11': 'cs11', 'CS 30': 'cs30', 'Math 21': 'math21' };

        // ─── state ──────────────────────────────────────────────────────────────
        let state = {
            confessions: [],
            memories: [],
            birthdays: [],
            queue: [],
            announcements: [],
            tests: []
        };
        let view = 'home';
        let admin = false;
        let loading = false;
        let adminKey = sessionStorage.getItem('commit-history-admin-key') || '';

        // ─── helpers ────────────────────────────────────────────────────────────
        function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;' }[c])); }

        function total(x) { return Object.values(x.reactions || {}).reduce((a, b) => a + Number(b || 0), 0); }

        function normalizePost(x) {
            return {
                ...x,
                tag: x.tag || `#${x.id || ''}`,
                alias: x.alias ?? x.name ?? 'anonymous',
                text: x.text ?? x.message ?? x.caption ?? '',
                caption: x.caption ?? x.message ?? x.text ?? '',
                src: x.src ?? x.image_url ?? '',
                reactions: x.reactions || {},
                status: x.status || (x.approved === false ? 'pending' : 'approved')
            };
        }

        function visitorId() {
            let id = localStorage.getItem('birthday-visitor');
            if (!id) { id = crypto.randomUUID();
                localStorage.setItem('birthday-visitor', id); }
            return id;
        }

        function reacted(x, r) { return localStorage.getItem(`reaction:${x.id}:${r}`) === '1'; }

        function pluralize(n, singular, plural) { return n === 1 ? singular : plural; }

        // ─── API ────────────────────────────────────────────────────────────────
        async function api(path, options = {}) {
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (adminKey && !headers.Authorization) {
                headers.Authorization = `Bearer ${adminKey}`;
            }
            const res = await fetch(API_BASE + path, {
                ...options,
                headers
            });
            const text = await res.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
            if (!res.ok) throw new Error(data.error || `API error ${res.status}`);
            return data;
        }

        // ─── load data ──────────────────────────────────────────────────────────
        async function loadData() {
            loading = true;
            try {
                const [confessions, memories, birthdays, announcements, tests] = await Promise.all([
                    api('/confessions'),
                    api('/memories'),
                    api('/birthdays').catch(() => []),
                    api('/announcements').catch(() => []),
                    api('/tests').catch(() => [])
                ]);
                state.confessions = (Array.isArray(confessions) ? confessions : confessions.data || []).map(normalizePost);
                state.memories = (Array.isArray(memories) ? memories : memories.data || []).map(normalizePost);
                state.birthdays = Array.isArray(birthdays) ? birthdays : [];
                state.announcements = Array.isArray(announcements) ? announcements : [];
                state.tests = Array.isArray(tests) ? tests : [];
            } catch (err) {
                console.error(err);
                state.confessions = [];
                state.memories = [];
                state.announcements = [];
                state.tests = [];
                alert('Could not connect to the backend. Check your Vercel API routes and Neon connection.');
            } finally {
                loading = false;
                render();
            }
        }

        // ─── render ─────────────────────────────────────────────────────────────
        function render() {
            if (loading) return shell(`<main class="wrap"><div class="empty">Loading from Neon…</div></main>`);
            if (view === 'home') return renderHome();
            if (view === 'announcements') return renderAnnouncementForum();
            renderFeed(view === 'memories');
        }

        function shell(inner) {
            const drift = state.memories.filter(x => x.src).slice(0, 3).map(x =>
                `<img src="${esc(x.src)}" alt="" loading="lazy">`
            ).join('');
            document.querySelector('#app').innerHTML = `
            <div class="memory-drift">${drift}</div>
            <nav class="nav">
              <button class="brand" onclick="go('home')">commit <span>history</span></button>
              <div class="nav-actions">
                <button class="admin-link" onclick="openModal('admin')">Admin</button>
              </div>
            </nav>
            ${inner}
            <footer>made for the moments worth keeping.</footer>
          `;
            makeLanguageInclusive();
          }

        function makeLanguageInclusive() {
            const walker = document.createTreeWalker(document.querySelector('#app'), NodeFilter.SHOW_TEXT);
            const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(node => {
                if (node.nodeValue.includes('Memories, confessions, and the tiny moments that make a community ours.')) { node.parentElement?.remove(); return; }
                node.nodeValue = node.nodeValue.replace(/Confessions/g, 'Forum').replace(/confessions/g, 'forum').replace(/Confession/g, 'Forum post').replace(/confession/g, 'forum post');
            });
            document.querySelectorAll('.eyebrow').forEach(el => { if (el.textContent.trim() === 'A shared archive / batch 2026') el.textContent = "Compscilog's Shared Archive / Batch 2026"; });
            document.querySelectorAll('.archive-grid .card').forEach(card => { if (card.textContent.includes('Archive rewind')) card.remove(); });
        }

        function go(v) { view = v;
            render(); }

        // ─── home ──────────────────────────────────────────────────────────────
        function renderHome() {
            const now = new Date(),
                m = now.getMonth(),
                d = now.getDate();
            const upcoming = state.birthdays.map(x => ({ ...x, date: new Date(x.birthday) }))
                .filter(x => !Number.isNaN(x.date))
                .sort((a, b) => ((a.date.getMonth() - m + 12) % 12) * 32 + a.date.getDate() - d -
                    (((b.date.getMonth() - m + 12) % 12) * 32 + b.date.getDate()))
                .slice(0, 4);
            const today = [...state.confessions, ...state.memories]
                .filter(x => { const dt = new Date(x.created_at); return dt.getMonth() === m && dt.getDate() === d; })
                .slice(0, 3);

            // announcements
            const annHtml = state.announcements.length ?
                state.announcements.map(a => {
                    const isAdmin = admin;
                    return `<div class="announcement-item">
                <div class="title">${esc(a.title)}</div>
                <div class="meta"><span>${new Date(a.created_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span>${a.author ? `<span>by ${esc(a.author)}</span>` : ''}</div>
                <div class="body">${esc(a.body)}</div>
                ${isAdmin ? `<div class="admin-actions"><button class="btn small danger" onclick="deleteAnnouncement(${a.id})">Delete</button></div>` : ''}
              </div>`;
                }).join('') :
                `<div class="empty" style="padding:20px 0;border:none;">No announcements yet.</div>`;

            // tests timeline
            const testsHtml = state.tests.length ?
                state.tests.map(t => {
                    const subjClass = SUBJECT_COLORS[t.subject] || '';
                    const isAdmin = admin;
                    return `<div class="test-item">
                <span class="subject-badge ${subjClass}">${esc(t.subject)}</span>
                <span class="test-date">${new Date(t.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>
                <span class="test-desc">${esc(t.description)}</span>
                ${isAdmin ? `<div class="admin-actions"><button class="btn small danger" onclick="deleteTest(${t.id})">×</button></div>` : ''}
              </div>`;
                }).join('') :
                `<div class="empty" style="padding:20px 0;border:none;">No tests added yet.</div>`;

            shell(`<main class="wrap"><section class="bulletin"><section class="bulletin-brand"><div class="eyebrow">A shared archive / batch 2026</div><h1>COMMIT<br>HISTORY</h1><p>Memories, confessions, and the tiny moments that make a community ours.</p><div class="bulletin-actions"><button class="btn primary" onclick="go('memories')">Share a memory</button><button class="btn" onclick="go('confessions')">Write a confession</button><button class="btn" onclick="openModal('about')">Community standards →</button></div></section><aside class="quick-card"><h2>Announcements</h2><div style="max-height:265px;overflow:auto">${annHtml}</div>${admin ? `<button class="btn small" onclick="openModal('addAnnouncement')">+ New announcement</button>` : ''}</aside></section><section class="home-grid" style="margin-top:32px"><div class="home-main"><span class="section-label">The archive</span><div class="archive-grid"><div class="card"><div class="eyebrow">Photo diary</div><h3>Memories</h3><p>${state.memories.length} approved snapshots from the people here.</p><button class="btn small" onclick="go('memories')">Open memories</button></div><div class="card"><div class="eyebrow">Say it</div><h3>Confessions</h3><p>${state.confessions.length} stories, thoughts, and little secrets.</p><button class="btn small" onclick="go('confessions')">Read confessions</button></div><div class="card"><div class="eyebrow">On this day</div><h3>Archive rewind</h3>${today.length ? today.map(x=>`<div class="mini-item"><b>${esc(x.alias)}</b><small>${esc((x.text||x.caption).slice(0,70))}</small></div>`).join('') : '<p>Nothing from this date yet. Leave a trace.</p>'}</div><div class="card"><div class="eyebrow">Coming up</div><h3>Birthdays</h3>${upcoming.length ? upcoming.map(x=>`<div class="mini-item"><b>${esc(x.name)}</b><small>${x.date.toLocaleDateString(undefined,{month:'long',day:'numeric'})}</small></div>`).join('') : '<p>No birthdays added yet.</p>'}<button class="btn small" onclick="openModal('birthday')">Birthday tracker</button></div></div></div><aside class="home-side"><div class="card"><div class="eyebrow">Test tracker</div><h3>Upcoming events</h3>${testsHtml}</div><div class="card"><div class="eyebrow">Got a thought?</div><h3>Community desk</h3><button class="btn small" onclick="openModal('feedback')">Give feedback</button> <button class="btn small" onclick="openModal('concern')">Serious concern</button></div></aside></section></main>`);
        }

        // ─── feed ───────────────────────────────────────────────────────────────
        function renderFeed(mem) {
            let items = state[mem ? 'memories' : 'confessions'];
            items = [...items].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

            const noun = mem ? 'memory' : 'confession';
            const plural = pluralize(items.length, noun, noun + (noun === 'memory' ? 'ies' : 's'));

            shell(`
            <main class="page">
              <button class="btn ghost small" onclick="go('home')" style="margin-bottom:10px">← Back home</button>
              <div class="pagehead">
                <div class="left">
                  <div class="eyebrow">${mem ? 'shared memories' : 'anonymous-ish thoughts'}</div>
                  <h2>${mem ? 'Memories' : 'Confessions'}</h2>
                  <p>${items.length} ${plural}</p>
                </div>
                <button class="btn primary" onclick="openModal('${mem?'memory':'confession'}')">${mem ? 'Add a memory' : 'Post a confession'}</button>
              </div>
              ${mem ? leader(items) : ''}
              <div class="toolbar">
                <input id="search" placeholder="Search…" oninput="filterPosts(this.value)">
                <select id="sortSelect" onchange="sortPosts(this.value)">
                  <option value="newest" selected>Newest first</option>
                  <option value="popular">Most reacted</option>
                </select>
                <button class="btn small viewtoggle" onclick="toggleGrid()" id="gridBtn">List view</button>
              </div>
              <div id="feed" class="feed grid">
                ${items.length ? items.map(x => post(x, mem)).join('') :
                `<div class="empty">Nothing here yet. Be the first to leave something behind.</div>`}
              </div>
            </main>
          `);
            if (items.length) loadInlineReplies(mem ? 'memory' : 'confession');
            const sel = document.getElementById('sortSelect');
            if (sel) sel.value = 'newest';
        }

        function leader(items) {
            const top = [...items].sort((a, b) => total(b) - total(a)).slice(0, 3);
            return `<div class="leader">${top.map((x,i) =>
            `<div class="rank">${x.src ? `<img src="${esc(x.src)}" alt="Top memory" loading="lazy">` : ''}
              <small>#${i+1} most reacted</small>
              <strong>${esc(x.alias)}</strong>
              <small>${total(x)} reactions</small>
            </div>`
          ).join('')}</div>`;
        }

        // ─── post card ──────────────────────────────────────────────────────────
        function post(x, mem) {
            return `
            <article class="post" data-id="${Number(x.id)}" data-kind="${mem?'memory':'confession'}" data-search="${esc((x.text||x.caption).toLowerCase())}">
              ${x.src ? `<img class="media" src="${esc(x.src)}" alt="Shared attachment" loading="lazy">` : ''}
              <div class="postbody">
                <div class="posttop">
                  <span class="tag">${esc(x.tag)}</span>
                  <span class="alias">${esc(x.alias)}</span>
                </div>
                <p>${esc(x.text || x.caption)}</p>
                <div class="replies-wrap" data-replies-for="${Number(x.id)}">
                  <div class="replies-title">Replies <span class="count-badge" id="replyCount_${x.id}">…</span></div>
                  <div class="reply-loading">Loading replies…</div>
                </div>
                <div class="reacts">
                  ${REACTIONS.filter(r => Number(x.reactions?.[r]||0) > 0).map(r =>
                    `<button class="react ${reacted(x,r)?'active':''}" onclick="react('${esc(x.tag)}',this,'${r}')">${r} <span class="count">${Number(x.reactions[r])}</span></button>`
                  ).join('')}
                  <button class="react reaction-trigger" onclick="toggleReactionMenu(this)">➕ <span class="count">${total(x)}</span></button>
                  <button class="react reply-toggle" onclick="toggleReplyForm(this, ${Number(x.id)})">
                    <span class="icon">💬</span> Reply
                  </button>
                  <div class="reaction-menu">
                    ${REACTIONS.map(r => `<button class="react-choice" onclick="react('${esc(x.tag)}',this,'${r}')">${r}</button>`).join('')}
                  </div>

        function enhancePublicCopy() {
            const actionRow = document.querySelector('.bulletin-actions');

                button.onclick = () => go('announcements');
                actionRow.insertBefore(button, actionRow.children[2]);
            }
            const walker = document.createTreeWalker(document.querySelector('#app'), NodeFilter.SHOW_TEXT);
            const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(n => { if (n.nodeValue.includes('Memories, confessions, and the tiny moments that make a community ours.')) { n.parentElement?.remove(); return; } n.nodeValue = n.nodeValue.replace(/Confessions/g, 'Forum').replace(/confessions/g, 'forum').replace(/Confession/g, 'Forum post').replace(/confession/g, 'forum post'); });
            document.querySelectorAll('.eyebrow').forEach(x => { if (x.textContent.trim() === 'A shared archive / batch 2026') x.textContent = "Compscilog's Shared Archive / Batch 2026"; });
            document.querySelectorAll('.bulletin-brand p').forEach(x => x.remove());
            document.querySelectorAll('.archive-grid .card').forEach(x => { if (x.textContent.includes('Archive rewind')) x.remove(); });
        }

        function renderAnnouncementForum() {
            const cards = state.announcements.map(a => `<article class="post announcement-forum" id="announcement-${a.id}"><div class="postbody"><div class="posttop"><span class="tag">${esc(a.subject || 'General')}</span><span>${new Date(a.created_at).toLocaleDateString()}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p><div id="announcementReplies_${a.id}" class="replies-wrap">Loading discussion…</div><div class="inline-reply-form open"><input id="announcementName_${a.id}" maxlength="40" placeholder="Alias"><textarea id="announcementMessage_${a.id}" maxlength="2000" placeholder="Ask a question or add to the discussion…"></textarea><button class="btn primary small" onclick="replyToAnnouncement(${a.id})">Reply</button></div></div></article>`).join('') || '<div class="empty">No announcements yet.</div>';
            shell(`<main class="page"><button class="btn ghost small back-home" onclick="go('home')">← Back home</button><div class="pagehead"><div class="left"><div class="eyebrow">Community bulletin</div><h2>Announcement forum</h2><p>Updates, subjects, and questions in one place.</p></div></div><div class="subject-sidebar"><b>Subjects</b>${[...new Set(state.announcements.map(a=>a.subject || 'General'))].map(s=>`<button class="btn small" onclick="filterAnnouncementSubject('${esc(s)}')">${esc(s)}</button>`).join('')}</div><div id="announcementFeed" class="feed">${cards}</div></main>`);
            state.announcements.forEach(a => loadAnnouncementReplies(a.id));
        }

        async function loadAnnouncementReplies(id) { const box=document.getElementById(`announcementReplies_${id}`); if (!box) return; try { const rows=await api(`/announcement-replies?announcement_id=${id}`); box.innerHTML=rows.length ? rows.map(r=>`<div class="reply-item"><b class="rname">${esc(r.name)}</b><span class="rmsg">${esc(r.message)}</span></div>`).join('') : '<div class="reply-empty">No replies yet — start the conversation.</div>'; } catch { box.textContent='Replies could not load.'; } }
        async function replyToAnnouncement(id) { const name=document.getElementById(`announcementName_${id}`).value.trim()||'anonymous'; const message=document.getElementById(`announcementMessage_${id}`).value.trim(); if (!message) return; await api('/announcement-replies',{method:'POST',body:JSON.stringify({announcement_id:id,name,message})}); document.getElementById(`announcementMessage_${id}`).value=''; loadAnnouncementReplies(id); }
        function filterAnnouncementSubject(subject) { document.querySelectorAll('.announcement-forum').forEach(x => x.style.display=x.querySelector('.tag').textContent===subject?'':'none'); }

        // ─── reply toggle ──────────────────────────────────────────────────────
        function toggleReplyForm(btn, id) {
            const form = document.getElementById(`replyForm_${id}`);
            if (!form) return;
            const isOpen = form.classList.contains('open');
            document.querySelectorAll('.inline-reply-form.open').forEach(f => { if (f !== form) f.classList.remove('open'); });
            form.classList.toggle('open');
            if (!isOpen) {
                const ta = form.querySelector('.reply-msg');
                if (ta) setTimeout(() => ta.focus(), 100);
            }
        }

        // ─── load inline replies ──────────────────────────────────────────────
        async function loadInlineReplies(kind) {
            const posts = [...document.querySelectorAll(`.post[data-kind="${kind}"]`)];
            await Promise.all(posts.map(async p => {
                const id = Number(p.dataset.id);
                const box = p.querySelector('.replies-wrap');
                if (!box) return;
                const countEl = box.querySelector('.count-badge');
                try {
                    const rows = await api(`/replies?post_type=${kind}&post_id=${id}`);
                    const count = rows.length;
                    if (countEl) countEl.textContent = count;
                    if (count === 0) {
                        box.classList.add('hidden');
                        return;
                    }
                    box.classList.remove('hidden');
                    const listHtml = rows.map(r =>
                        `<div class="reply-item"><span class="rname">${esc(r.name)}</span><span class="rmsg">${esc(r.message)}</span></div>`
                    ).join('');
                    box.innerHTML = `
                <div class="replies-title">Replies <span class="count-badge">${count}</span></div>
                ${listHtml}
              `;
                    // re-attach the form
                    const form = p.querySelector('.inline-reply-form');
                    if (form) box.appendChild(form);
                    const oldForm = box.querySelector('.inline-reply-form');
                    if (oldForm) {
                        oldForm.querySelector('.reply-msg')?.addEventListener('keydown', e => {
                            if (e.key === 'Enter' && !e.shiftKey) {
                                e.preventDefault();
                                sendInlineReply(e, kind, id);
                            }
                        });
                    }
                } catch (err) {
                    box.innerHTML =
                    `<div class="replies-title">Replies</div><div class="reply-empty">Could not load replies.</div>`;
                }
            }));
        }

        // ─── send inline reply ─────────────────────────────────────────────────
        async function sendInlineReply(e, kind, id) {
            if (e && e.preventDefault) e.preventDefault();
            const form = e && e.currentTarget ? e.currentTarget : document.querySelector(`#replyForm_${id}`);
            if (!form) return;
            const nameInput = form.querySelector('.reply-name');
            const msgInput = form.querySelector('.reply-msg');
            const message = msgInput?.value?.trim() || '';
            const name = nameInput?.value?.trim() || 'anonymous';
            if (!message) return;

            try {
                await api('/replies', {
                    method: 'POST',
                    body: JSON.stringify({ post_type: kind, post_id: id, name, message })
                });
                if (msgInput) msgInput.value = '';
                if (nameInput) nameInput.value = '';
                form.classList.remove('open');
                await loadInlineReplies(kind);
            } catch (err) {
                alert(err.message || 'Reply could not be posted.');
            }
        }

        // ─── reactions ──────────────────────────────────────────────────────────
        async function react(tag, btn, r) {
            const arr = view === 'memories' ? state.memories : state.confessions;
            const x = arr.find(y => y.tag === tag);
            if (!x) return;
            try {
                const was = reacted(x, r);
                const result = await api('/reactions', {
                    method: 'POST',
                    body: JSON.stringify({
                        post_type: view === 'memories' ? 'memory' : 'confession',
                        post_id: x.id,
                        reaction: r,
                        action: was ? 'remove' : 'add',
                        visitor_id: visitorId()
                    })
                });
                x.reactions = result.reactions || {};
                localStorage.setItem(`reaction:${x.id}:${r}`, was ? '0' : '1');
                const old = btn.closest('.post');
                if (old) {
                    const temp = document.createElement('div');
                    temp.innerHTML = post(x, view === 'memories');
                    const fresh = temp.firstElementChild;
                    const oldForm = old.querySelector('.inline-reply-form');
                    const newForm = fresh?.querySelector('.inline-reply-form');
                    if (oldForm && newForm) {
                        if (oldForm.classList.contains('open')) newForm.classList.add('open');
                    }
                    old.replaceWith(fresh);
                    if (view !== 'memories') loadInlineReplies('confession');
                    else loadInlineReplies('memory');
                }
            } catch (err) {
                console.error(err);
                alert('Reaction could not be saved.');
            }
        }

        function sortPosts(v) {
            const mem = view === 'memories';

            if (v === 'popular') items = [...items].sort((a, b) => total(b) - total(a));
            else items = [...items].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            const feed = document.querySelector('#feed');

                document.querySelector('#src').value = r.result;
                const p = document.querySelector('#imagePreview');

                p.style.display = 'block';
            };
            r.readAsDataURL(file);
        }

        document.addEventListener('paste', e => {
            if (!document.querySelector('.modalback') || !document.querySelector('#imagePreview')) return;
            const item = [...(e.clipboardData?.items || [])].find(x => x.type.startsWith('image/'));
            if (item) { e.preventDefault();
                readImage(item.getAsFile()); }
        });

        // ─── submit post ────────────────────────────────────────────────────────
        async function submitPost(mem) {
            const alias = (document.querySelector('#alias').value.trim() || 'anonymous').slice(0, 40);
            const text = document.querySelector('#text').value.trim();
            if (!text) return alert('Please add some text.');
            const src = document.querySelector('#src')?.value?.trim() || undefined;
            if (mem && !src) return alert('Please choose or paste an image.');

            const payload = {
                name: alias,
                alias,
                message: text,
                text,
                caption: mem ? text : undefined,
                src,
                image_url: src
            };

            try {
                await api(mem ? '/memories' : '/confessions', { method: 'POST', body: JSON.stringify(payload) });
                closeModal();
                alert(mem ? 'Memory posted.' : 'Confession posted.');
                await loadData();
            } catch (err) {
                console.error(err);
                alert('Submission failed. Check your backend API.');
            }
        }

        // ─── init ──────────────────────────────────────────────────────────────
        adminKey = sessionStorage.getItem('commit-history-admin-key') || '';
        loadData();

        setInterval(() => {
            if (!document.hidden && !document.querySelector('.modalback')) loadData();
        }, 45000);

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
    </script>

</body>
</html>
